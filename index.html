<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Sticker</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #msg {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff; padding: 6px 14px;
      border-radius: 20px; font-size: 13px; z-index: 999; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="msg">Apunta al sticker</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'snoopy';

    const scene = document.createElement('a-scene');
    scene.setAttribute('mindar-image', `imageTargetSrc: ./assets/${id}.mind; uiScanning: no;`);
    scene.setAttribute('vr-mode-ui', 'enabled: false');
    scene.setAttribute('device-orientation-permission-ui', 'enabled: false');

    scene.innerHTML = `
      <a-assets>
        <video id="vid" src="./assets/${id}.mp4" preload="auto" loop="true" playsinline webkit-playsinline muted crossorigin="anonymous"></video>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0" id="target">
        <a-video src="#vid" position="0 0 0" height="1" width="1"></a-video>
      </a-entity>
    `;

    document.body.appendChild(scene);

    window.addEventListener('load', () => {
      const target = document.getElementById('target');
      const vid = document.getElementById('vid');
      target.addEventListener('targetFound', () => vid.play().catch(e => console.log(e)));
      target.addEventListener('targetLost', () => vid.pause());
    });
  </script>
</body>
</html>
