<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Sticker - Sopita de Marciano</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background: #000; 
      font-family: sans-serif; 
    }
    #msg {
      position: fixed; 
      top: 15px; 
      left: 50%; 
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7); 
      color: #fff; 
      padding: 8px 16px;
      border-radius: 20px; 
      font-size: 13px; 
      z-index: 999; 
      pointer-events: none;
    }
    #play-btn {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff1464;
      color: #fff;
      border: 2px solid #000;
      padding: 10px 22px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 14px;
      z-index: 1000;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
    }
  </style>
</head>
<body>
  <div id="msg">Apunta al sticker</div>
  <button id="play-btn">Activar Sonido / Reproducción</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'snoopy';

    const scene = document.createElement('a-scene');
    scene.setAttribute('mindar-image', `imageTargetSrc: ./assets/${id}/${id}.mind; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001;`);
    scene.setAttribute('color-space', 'sRGB');
    scene.setAttribute('renderer', 'colorManagement: true, physicallyCorrectLights');
    scene.setAttribute('vr-mode-ui', 'enabled: false');
    scene.setAttribute('device-orientation-permission-ui', 'enabled: false');

    scene.innerHTML = `
      <a-assets>
        <video id="vid" src="./assets/${id}/${id}.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#vid" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-video>
      </a-entity>
    `;

    document.body.appendChild(scene);

    const video = document.querySelector('#vid');
    const playBtn = document.querySelector('#play-btn');

    playBtn.addEventListener('click', () => {
      video.play().then(() => {
        playBtn.style.display = 'none';
      }).catch(err => console.log('Audio autoplay prevented:', err));
    });
  </script>
</body>
</html>
